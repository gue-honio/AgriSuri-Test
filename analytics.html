<!DOCTYPE html>
<html lang="fil">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriSense PH — Analytics</title>
  <meta name="theme-color" content="#1e5c1e">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f5f0;min-height:100vh}
    .header{background:#1e5c1e;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
    .back-btn{background:rgba(255,255,255,0.15);border:none;color:#fff;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;text-decoration:none;display:flex;align-items:center;gap:5px}
    .h-title{color:#fff;font-size:15px;font-weight:700}
    .h-sub{color:#a8d4a8;font-size:10px}
    .content{max-width:480px;margin:0 auto;padding:14px 12px 90px}
    .sec{font-size:11px;font-weight:700;color:#3a6a3a;letter-spacing:.07em;text-transform:uppercase;margin:16px 0 8px;display:flex;align-items:center;gap:6px}
    .sec::after{content:'';flex:1;height:1px;background:#d4e8d4}
    .metric-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:4px}
    .metric-card{background:#fff;border-radius:14px;padding:14px;border:.5px solid #d4e8d4}
    .m-icon{font-size:20px;margin-bottom:6px;display:block}
    .m-val{font-size:28px;font-weight:800;color:#1a3a1a;line-height:1}
    .m-lbl{font-size:11px;color:#5a7a5a;margin-top:3px}
    .chart-card{background:#fff;border-radius:14px;padding:14px;border:.5px solid #d4e8d4;margin-bottom:12px}
    .chart-title{font-size:13px;font-weight:700;color:#1a3a1a;margin-bottom:12px}
    .chart-wrap{position:relative;height:200px}
    .sev-bar{display:flex;gap:4px;margin-bottom:8px}
    .sev-seg{flex:1;height:8px;border-radius:4px}
    .sev-mild{background:#7ab87a}
    .sev-mod{background:#c08000}
    .sev-sev{background:#c02020}
    .sev-lbls{display:flex;justify-content:space-between;font-size:10px;color:#5a7a5a;margin-top:4px}
    .hist-card{background:#fff;border-radius:14px;border:.5px solid #d4e8d4;overflow:hidden;margin-bottom:12px}
    .hist-header{padding:12px 14px;font-size:13px;font-weight:700;color:#1a3a1a;border-bottom:1px solid #e8f0e8;display:flex;justify-content:space-between;align-items:center}
    .hist-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:.5px solid #f0f8f0}
    .hist-row:last-child{border-bottom:none}
    .hist-crop{font-size:20px;flex-shrink:0}
    .hist-info{flex:1;min-width:0}
    .hist-disease{font-size:13px;font-weight:600;color:#1a3a1a}
    .hist-meta{font-size:11px;color:#7a9a7a;margin-top:2px}
    .conf-badge{font-size:12px;font-weight:700;padding:3px 8px;border-radius:10px;flex-shrink:0}
    .c-high{background:#eaf5ea;color:#1a5a1a}
    .c-med{background:#fff8e8;color:#7a4a00}
    .c-low{background:#fff0f0;color:#8a1010}
    .btn-export{width:100%;padding:12px;background:#eaf5ea;color:#1e5c1e;border:1.5px solid #a8d0a8;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:8px}
    .loading{text-align:center;padding:40px 20px;color:#5a7a5a}
    .loading-spin{width:32px;height:32px;border:3px solid #d4e8d4;border-top-color:#1e5c1e;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .empty-state{text-align:center;padding:30px 20px;color:#7a9a7a}
    .empty-icon{font-size:40px;display:block;margin-bottom:10px}
    .nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #d4e8d4;display:flex;max-width:480px;margin:0 auto}
    .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;cursor:pointer;background:none;border:none}
    .nav-svg{width:22px;height:22px;stroke:#9ab49a;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .nav-lbl{font-size:10px;font-weight:600;color:#8a9a8a}
    .nav-btn.active .nav-svg{stroke:#1e5c1e}
    .nav-btn.active .nav-lbl{color:#1e5c1e}
  </style>
</head>
<body>

<div class="header">
  <div style="display:flex;align-items:center;gap:10px">
    <a href="index.html" class="back-btn">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      Bumalik
    </a>
    <div>
      <div class="h-title">📊 Aking Analytics</div>
      <div class="h-sub" id="farmer-sub">AgriSense PH</div>
    </div>
  </div>
</div>

<div class="content" id="content">
  <div class="loading">
    <div class="loading-spin"></div>
    <div>Nilo-load ang iyong data...</div>
  </div>
</div>

<nav class="nav">
  <button class="nav-btn" onclick="window.location.href='index.html'">
    <svg class="nav-svg" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <span class="nav-lbl">Suriin</span>
  </button>
  <button class="nav-btn active">
    <svg class="nav-svg" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
    <span class="nav-lbl">Analytics</span>
  </button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb = window.supabase.createClient(
  'https://unwzvscuxsdnesqieahc.supabase.co',
  'sb_publishable_lvUkeeahwkVKhNSKE1FvAQ_nVWf9g13'
);

let myDets=[], charts={};

async function init(){
  const{data:{session}}=await sb.auth.getSession();
  if(!session){window.location.href='auth.html';return}

  const{data:p}=await sb.from('users').select('name,barangay').eq('id',session.user.id).single();
  if(p) document.getElementById('farmer-sub').textContent=`👨‍🌾 ${p.name} · ${p.barangay||'Central Luzon'}`;

  const{data}=await sb.from('detections').select('*').eq('user_id',session.user.id).order('created_at',{ascending:false}).limit(100);
  myDets=data||[];
  render();
}

function render(){
  const c=document.getElementById('content');
  if(!myDets.length){
    c.innerHTML=`
      <div class="empty-state">
        <span class="empty-icon">🌱</span>
        <div style="font-size:14px;font-weight:700;color:#3a6a3a;margin-bottom:6px">Wala pang detections</div>
        <div style="font-size:13px;color:#7a9a7a">Mag-detect ng sakit para makita ang iyong analytics dito.</div>
      </div>
      <a href="index.html"><button style="width:100%;padding:13px;background:#1e5c1e;color:#fff;border:none;border-radius:14px;font-size:14px;font-weight:700;cursor:pointer;margin-top:16px">🔍 Mag-detect ngayon</button></a>`;
    return;
  }

  const total=myDets.length;
  const diseased=myDets.filter(d=>!d.disease?.toLowerCase().includes('healthy')).length;
  const healthy=total-diseased;
  const rice=myDets.filter(d=>d.crop==='rice').length;
  const tomato=myDets.filter(d=>d.crop==='tomato').length;
  const avgConf=Math.round(myDets.reduce((s,d)=>s+(d.confidence||0),0)/total);
  const mild=myDets.filter(d=>d.severity==='mild').length;
  const mod=myDets.filter(d=>d.severity==='moderate').length;
  const sev=myDets.filter(d=>d.severity==='severe').length;
  const dc={};myDets.forEach(d=>dc[d.disease]=(dc[d.disease]||0)+1);
  const top=Object.entries(dc).sort((a,b)=>b[1]-a[1]).slice(0,5);

  c.innerHTML=`
    <div class="sec">Buod · Summary</div>
    <div class="metric-grid">
      <div class="metric-card"><span class="m-icon">🔍</span><div class="m-val">${total}</div><div class="m-lbl">Kabuuang Detections</div></div>
      <div class="metric-card"><span class="m-icon">🦠</span><div class="m-val">${diseased}</div><div class="m-lbl">May Sakit (${Math.round(diseased/total*100)}%)</div></div>
      <div class="metric-card"><span class="m-icon">✅</span><div class="m-val">${healthy}</div><div class="m-lbl">Malusog (${Math.round(healthy/total*100)}%)</div></div>
      <div class="metric-card"><span class="m-icon">🎯</span><div class="m-val">${avgConf}%</div><div class="m-lbl">Average Accuracy</div></div>
    </div>

    <div class="sec">Severity Level</div>
    <div class="chart-card">
      <div class="sev-bar">
        <div style="flex:${mild||1}" class="sev-seg sev-mild"></div>
        <div style="flex:${mod||0.01}" class="sev-seg sev-mod"></div>
        <div style="flex:${sev||0.01}" class="sev-seg sev-sev"></div>
      </div>
      <div class="sev-lbls"><span>🟢 Mild: ${mild}</span><span>🟡 Moderate: ${mod}</span><span>🔴 Severe: ${sev}</span></div>
    </div>

    <div class="sec">Disease Breakdown</div>
    <div class="chart-card"><div class="chart-wrap"><canvas id="c-disease"></canvas></div></div>

    <div class="sec">Per Pananim</div>
    <div class="chart-card"><div class="chart-wrap"><canvas id="c-crop"></canvas></div></div>

    <div class="sec">Kasaysayan · History</div>
    <div class="hist-card">
      <div class="hist-header">
        <span>Huling ${Math.min(myDets.length,20)} Detections</span>
        <button onclick="exportCSV()" style="background:#eaf5ea;border:none;border-radius:8px;padding:4px 10px;font-size:11px;font-weight:600;color:#1a5a1a;cursor:pointer">📥 Export</button>
      </div>
      ${myDets.slice(0,20).map(d=>{
        const isH=d.disease?.toLowerCase().includes('healthy');
        const cc=d.confidence>=85?'c-high':d.confidence>=70?'c-med':'c-low';
        return`<div class="hist-row">
          <div class="hist-crop">${d.crop==='rice'?'🌾':'🍅'}</div>
          <div class="hist-info">
            <div class="hist-disease" style="color:${isH?'#1a7a3a':'#c05000'}">${d.disease||'—'}</div>
            <div class="hist-meta">${fmtDate(d.created_at)} · ${d.location_name||'—'}</div>
          </div>
          <div class="conf-badge ${cc}">${d.confidence||'—'}%</div>
        </div>`;
      }).join('')}
    </div>`;

  setTimeout(()=>{
    // Disease chart
    const colors=['#c05000','#b84a00','#8a5a00','#1e7a3e','#d04000'];
    if(charts.d)charts.d.destroy();
    charts.d=new Chart(document.getElementById('c-disease'),{type:'bar',data:{labels:top.map(([d])=>d),datasets:[{data:top.map(([,c])=>c),backgroundColor:colors,borderRadius:8}]},options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,ticks:{stepSize:1}},y:{ticks:{font:{size:10}}}}}});

    // Crop chart
    if(charts.c)charts.c.destroy();
    charts.c=new Chart(document.getElementById('c-crop'),{type:'doughnut',data:{labels:['Palay / Rice','Kamatis / Tomato'],datasets:[{data:[rice,tomato],backgroundColor:['#1e5c1e','#c05000'],borderWidth:2,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{font:{size:11}}}}}});
  },100);
}

function exportCSV(){
  const h=['Date','Crop','Disease','Confidence','Severity','Location'];
  const r=myDets.map(d=>[fmtDate(d.created_at),d.crop,d.disease,d.confidence,d.severity||'',d.location_name||'']);
  const csv=[h,...r].map(x=>x.map(c=>`"${c}"`).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='my_detections.csv';
  document.body.appendChild(a);a.click();setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url)},100);
}

function fmtDate(s){
  if(!s)return'—';
  const d=new Date(s);
  return d.toLocaleDateString('en-PH',{month:'short',day:'numeric',year:'numeric'})+' '+d.toLocaleTimeString('en-PH',{hour:'2-digit',minute:'2-digit'});
}

init();
</script>
</body>
</html>
